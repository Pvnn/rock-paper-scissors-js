<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="STYLES/rock-paper-scissors-7.css">
</head>
<body>
  <h2>Rock Paper Scissors</h2>
  
  
  <button class="rock-button js-rock-button">
    <img src="IMAGES/rock-emoji.png" alt="">
  </button>

  <button class="paper-button js-paper-button">
    <img src="IMAGES/paper-emoji.png" alt="">
  </button>

  <button class="scissors-button js-scissors-button">
    <img src="IMAGES/scissors-emoji.png" alt="">
  </button>

  <p class="js-result result"></p>
  <p class="js-moves"></p>
  <p class="js-score score"></p>

  <button class="reset-button js-reset-button">Reset Score</button>
  <button class="auto-play-button js-auto-play-button">Auto Play</button>
  <div class="confirmation-line js-confirmation-line"></div>
  <script src="SCRIPTS/rock-paper-scissors-7.js"></script>
</body>
</html>
